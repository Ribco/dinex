<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Dinex — Dashboard</title>

	<style>
		body {
			margin: 0;
			background: #0b0d12;
			color: #f5f7fa;
			font-family: system-ui, sans-serif;
		}

		header {
			padding: 20px 28px;
			border-bottom: 1px solid #242936;
			background: #11141b;
		}

		main {
			max-width: 1100px;
			margin: auto;
			padding: 28px;
		}

		.card {
			padding: 24px;
			border: 1px solid #242936;
			border-radius: 16px;
			background: #11141b;
		}

		.status {
			color: #55e69a;
			font-weight: 700;
		}
	</style>
</head>

<body>
	<header>
		🦖 <strong>Dinex</strong>
	</header>

	<main>
		<h1>Dashboard</h1>

		<div class="card">
			<h2>Welcome to Dinex</h2>
			<p>Your panel is running.</p>
			<p class="status">● Panel Online</p>
		</div>
	</main>
</body>
</html>
